<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Tracker — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e11;
    --panel: #16171b;
    --panel-hover: #1c1e23;
    --border: #26282e;
    --text: #f0f1f3;
    --text-dim: #8b8d94;
    --accent: #5b8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px; margin-bottom: 18px;
  }
  .title { font-weight: 600; font-size: 15px; color: var(--text-dim); }
  .count { font-size: 13px; color: var(--text-dim); }
  .card {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    max-width: 300px;
    transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--status-color, var(--border));
  }
  .card:hover {
    background: var(--panel-hover);
    transform: translateY(-2px);
    border-color: var(--status-color, var(--border));
    box-shadow: 0 12px 28px -10px var(--status-glow, rgba(0,0,0,0.4));
  }
  .avatar-wrap { position: relative; flex: none; }
  .avatar, .avatar-img { width: 48px; height: 48px; border-radius: 50%; }
  .avatar {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #0b0d14; background: var(--accent);
  }
  .avatar-img { object-fit: cover; display: block; }
  .status-dot {
    position: absolute; bottom: -1px; right: -1px;
    width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid var(--panel);
    background: var(--status-color, #6b6d75);
  }
  .who { min-width: 0; }
  .name { font-weight: 700; font-size: 15px; }
  .role {
    color: var(--status-color, var(--text-dim)); font-size: 13px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="section-head">
    <span class="title">Development Team</span>
    <span class="count">1</span>
  </div>

  <a class="card" id="card" href="https://www.roblox.com/users/423428585/profile" target="_blank" rel="noopener noreferrer">
    <div class="avatar-wrap">
      <div class="avatar" id="avatar">H2</div>
      <img class="avatar-img" id="avatarImg" style="display:none" alt="">
      <span class="status-dot" id="dot"></span>
    </div>
    <div class="who">
      <div class="name" id="name">HARRY2O6</div>
      <div class="role" id="role">Connecting…</div>
    </div>
  </a>

  <div class="hint" id="hint">Connecting to Roblox…</div>
</div>

<script>
const USER_ID = 423428585;
const POLL_MS = 15000;

const STATUS = {
  playing: { label: 'Playing',   color: '#3ddc84' },
  studio:  { label: 'In Studio', color: '#ff9a3d' },
  online:  { label: 'Online',    color: '#6b6d75' },
  offline: { label: 'Offline',   color: '#6b6d75' },
  unknown: { label: 'Unknown',   color: '#6b6d75' },
};

// Roblox's API has no CORS headers for browser-to-server requests from
// other domains, so a public relay is used to fetch on the page's behalf.
// This is the trade-off for having zero backend code: if a relay is down,
// the next one in the list is tried before giving up for this poll.
const PROXIES = [
  (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
];

async function fetchViaProxy(url) {
  let lastErr;
  for (const wrap of PROXIES) {
    try {
      const res = await fetch(wrap(url));
      if (!res.ok) throw new Error(`status ${res.status}`);
      return await res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('all proxies failed');
}

function applyStatus(key, extra) {
  const s = STATUS[key] || STATUS.unknown;
  const card = document.getElementById('card');
  card.style.setProperty('--status-color', s.color);
  card.style.setProperty('--status-glow', `${s.color}55`);
  document.getElementById('dot').style.background = s.color;
  document.getElementById('role').textContent = extra ? `${s.label} — ${extra}` : s.label;
}

async function poll() {
  try {
    const presence = await fetchViaProxy(`https://www.roblox.com/presence/user?userId=${USER_ID}`);
    const typeMap = { 0: 'offline', 1: 'online', 2: 'playing', 3: 'studio' };
    const key = typeMap[presence.UserPresenceType] ?? 'unknown';
    applyStatus(key, key === 'playing' ? (presence.LastLocation || '') : '');

    const userData = await fetchViaProxy(`https://users.roblox.com/v1/users/${USER_ID}`);
    if (userData?.name) document.getElementById('name').textContent = userData.name;

    const avatarData = await fetchViaProxy(
      `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${USER_ID}&size=150x150&format=Png&isCircular=true`
    );
    const avatarUrl = avatarData?.data?.[0]?.imageUrl;
    if (avatarUrl) {
      const img = document.getElementById('avatarImg');
      img.src = avatarUrl;
      img.style.display = 'block';
      document.getElementById('avatar').style.display = 'none';
    }

    document.getElementById('hint').textContent =
      `Live from Roblox · last checked ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    applyStatus('unknown');
    document.getElementById('hint').textContent =
      `Couldn't reach Roblox right now — retrying · last attempt ${new Date().toLocaleTimeString()}`;
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
