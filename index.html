<html lang="en">

  <meta charset="UTF-8">

  <title>Dev Tracker</title>

  <style>

      box-sizing: border-box;
    }

      margin: 0;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;

      margin: 0 0 25px;

      margin-top: 2px;
      color: #666666;

      }

  </style>
</head>

<body>

  <div class="container">

    <h1>Dev Tracker</h1>

    <p class="subtitle">
      Development team status
    </p>

    <div class="section">
      Development Team
    </div>

    <a
      class="card"
      href="https://www.roblox.com/users/423428585/profile"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="left">

        <div class="avatar-wrap">

          <div class="avatar" id="avatar">
            H2
          </div>

          <img
            class="avatar-img"
            id="avatarImg"
            alt="Roblox avatar"
          >

          <span
            class="status-dot"
            id="statusDot"
          ></span>

        </div>

        <div>

          <div
            class="name"
            id="name"
          >
            HARRY2O6
          </div>

          <div
            class="status"
            id="status"
          >
            Checking...
          </div>

          <div
            class="extra"
            id="extra"
          >
            Roblox
          </div>

        </div>

      </div>

      <div class="profile">
        View Profile
      </div>

    </a>

    <div
      class="footer"
      id="footer"
    >
      Checking Roblox...
    </div>

  </div>

  <script>
    const USER_ID = 423428585;
    const POLL_TIME = 15000;

    const STATUS = {
      playing: {
        text: "Playing",
        color: "#42d77d"
      },

      studio: {
        text: "In Studio",
        color: "#f0a34a"
      },

      online: {
        text: "Online",
        color: "#5b8cff"
      },

      offline: {
        text: "Offline",
        color: "#777777"
      },

      unknown: {
        text: "Unknown",
        color: "#777777"
      }
    };

    async function getData(type) {
      const response = await fetch(
        `/api/roblox?type=${type}&userId=${USER_ID}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("Request failed");
      }

      return response.json();
    }

    function setStatus(type, extra = "Roblox") {
      const status = STATUS[type] || STATUS.unknown;

      document.getElementById("status").textContent =
        status.text;

      document.getElementById("status").style.color =
        status.color;

      document.getElementById("statusDot").style.background =
        status.color;

      document.getElementById("extra").textContent =
        extra;
    }

    async function loadUser() {
      try {
        const data = await getData("user");

        if (data.name) {
          document.getElementById("name").textContent =
            data.name;
        }
      } catch (error) {
        console.error(error);
      }
    }

    async function loadAvatar() {
      try {
        const data = await getData("avatar");

        const imageUrl =
          data?.data?.[0]?.imageUrl;

        if (!imageUrl) {
          return;
        }

        const img =
          document.getElementById("avatarImg");

        img.src = imageUrl;

        img.onload = () => {
          img.style.display = "block";
          document.getElementById("avatar").style.display = "none";
        };

      } catch (error) {
        console.error(error);
      }
    }

    async function updateStatus() {
      try {
        const data = await getData("presence");

        const presence =
          data?.userPresences?.[0];

        if (!presence) {
          setStatus("unknown");
          return;
        }

        const typeMap = {
          0: "offline",
          1: "online",
          2: "playing",
          3: "studio"
        };

        const type =
          typeMap[presence.userPresenceType] ||
          "unknown";

        let extra = "Roblox";

        if (type === "offline") {
          extra = "Not currently online";
        }

        if (type === "playing") {
          extra =
            presence.lastLocation ||
            "Playing on Roblox";
        }

        if (type === "studio") {
          extra = "Roblox Studio";
        }

        setStatus(type, extra);

        document.getElementById("footer").textContent =
          `Last checked ${new Date().toLocaleTimeString()}`;

      } catch (error) {
        console.error(error);

        setStatus(
          "unknown",
          "Couldn't check Roblox"
        );

        document.getElementById("footer").textContent =
          "Connection error";
      }
    }

    async function start() {
      await Promise.all([
        loadUser(),
        loadAvatar(),
        updateStatus()
      ]);
    }

    start();

    setInterval(
      updateStatus,
      POLL_TIME
    );
  </script>

</body>
</html>
