<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dev Tracker — Live</title>
  <meta
    name="description"
    content="Live Roblox development team status tracker."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #07090d;
      --bg-soft: #0b0e13;
      --panel: rgba(16, 19, 26, 0.78);
      --panel-solid: #10131a;
      --panel-hover: #151923;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);

      --text: #f5f7fb;
      --text-soft: #b6bdca;
      --text-dim: #757e8d;

      --accent: #6ea8ff;
      --accent-soft: rgba(110, 168, 255, 0.12);

      --green: #40df8a;
      --orange: #ffad5c;
      --red: #ff6464;
      --grey: #778090;

      --status-color: var(--grey);
      --status-glow: rgba(119, 128, 144, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(76, 120, 255, 0.13),
          transparent 38%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(69, 99, 170, 0.08),
          transparent 30%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);

      background-size: 32px 32px;

      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,0.7),
        transparent 80%
      );
    }

    .container {
      width: min(1060px, calc(100% - 32px));
      margin: 0 auto;
      padding: 46px 0 70px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.14),
          rgba(255,255,255,0.03)
        ),
        #111722;

      border: 1px solid var(--border-strong);

      box-shadow:
        inset 0 1px rgba(255,255,255,0.08),
        0 12px 35px rgba(0,0,0,0.28);
    }

    .brand-icon svg {
      width: 21px;
      height: 21px;
    }

    .eyebrow {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      margin-bottom: 4px;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 9px 13px;

      border: 1px solid rgba(64, 223, 138, 0.18);
      border-radius: 999px;

      background: rgba(64, 223, 138, 0.06);

      color: #a4efc5;
      font-size: 12px;
      font-weight: 700;

      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px rgba(64, 223, 138, 0.9);

      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.75);
      }
    }

    /* SECTION */

    .section {
      margin-top: 26px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--text-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .section-label::before {
      content: "";
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--accent);

      box-shadow: 0 0 12px rgba(110,168,255,0.75);
    }

    .member-count {
      color: var(--text-dim);
      font-size: 12px;
    }

    /* CARD */

    .card {
      position: relative;
      display: block;

      min-height: 158px;
      padding: 24px;

      text-decoration: none;
      color: inherit;

      border: 1px solid var(--border);
      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          transparent 32%
        ),
        var(--panel);

      backdrop-filter: blur(18px);

      overflow: hidden;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card::before {
      content: "";

      position: absolute;
      inset: 0 0 auto 0;

      height: 2px;

      background: var(--status-color);

      box-shadow: 0 0 24px var(--status-glow);
    }

    .card::after {
      content: "";

      position: absolute;
      width: 280px;
      height: 280px;

      top: -180px;
      right: -90px;

      border-radius: 50%;

      background: var(--status-glow);

      filter: blur(50px);
      opacity: 0.35;

      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-3px);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.05),
          transparent 35%
        ),
        var(--panel-hover);

      border-color: color-mix(
        in srgb,
        var(--status-color) 38%,
        var(--border)
      );

      box-shadow:
        0 22px 55px rgba(0,0,0,0.34),
        0 0 30px var(--status-glow);
    }

    .card-content {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 17px;
      min-width: 0;
    }

    /* AVATAR */

    .avatar-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .avatar-shell {
      width: 70px;
      height: 70px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #202734,
          #11151c
        );

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        inset 0 1px rgba(255,255,255,0.06),
        0 10px 30px rgba(0,0,0,0.28);
    }

    .avatar {
      width: 100%;
      height: 100%;

      display: grid;
      place-items: center;

      color: white;

      font-size: 18px;
      font-weight: 800;

      background:
        radial-gradient(
          circle at 35% 25%,
          rgba(255,255,255,0.22),
          transparent 35%
        ),
        linear-gradient(135deg, #527dff, #314a94);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      display: none;

      object-fit: cover;
    }

    .status-dot {
      position: absolute;

      right: -4px;
      bottom: -4px;

      width: 19px;
      height: 19px;

      border-radius: 50%;

      background: var(--status-color);

      border: 4px solid var(--panel-solid);

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 0 18px var(--status-glow);
    }

    /* TEXT */

    .who {
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .name {
      margin: 0;

      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .verified {
      width: 16px;
      height: 16px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: #0b1020;
      background: #74a5ff;
    }

    .verified svg {
      width: 10px;
      height: 10px;
    }

    .role {
      margin-top: 6px;

      color: var(--status-color);

      font-size: 13px;
      font-weight: 700;
    }

    .subtext {
      margin-top: 4px;

      color: var(--text-dim);

      font-size: 12px;

      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* RIGHT SIDE */

    .right-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;

      flex: 0 0 auto;
    }

    .profile-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 10px 14px;

      border-radius: 11px;

      color: #dfe7f6;
      background: rgba(255,255,255,0.045);

      border: 1px solid rgba(255,255,255,0.08);

      font-size: 12px;
      font-weight: 700;

      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .card:hover .profile-btn {
      background: rgba(255,255,255,0.075);
      border-color: rgba(255,255,255,0.13);
      transform: translateX(2px);
    }

    .profile-btn svg {
      width: 14px;
      height: 14px;
    }

    /* FOOTER */

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-top: 14px;
      padding: 0 4px;

      color: var(--text-dim);

      font-size: 11px;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .connection-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--status-color);
      box-shadow: 0 0 10px var(--status-glow);
    }

    /* LOADING */

    .loading {
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .container {
        width: min(100% - 22px, 1060px);
        padding-top: 25px;
      }

      .header {
        align-items: flex-start;
        margin-bottom: 24px;
      }

      .brand-title {
        font-size: 24px;
      }

      .card {
        min-height: unset;
        padding: 18px;
        border-radius: 18px;
      }

      .card-content {
        align-items: flex-start;
      }

      .person {
        align-items: flex-start;
      }

      .avatar-shell {
        width: 58px;
        height: 58px;
        border-radius: 17px;
      }

      .right-side {
        display: none;
      }

      .subtext {
        max-width: 240px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="4" width="16" height="16" rx="4"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
        </div>

        <div>
          <div class="eyebrow">Developer Dashboard</div>
          <h1 class="brand-title">Dev Tracker</h1>
        </div>
      </div>

      <div class="live-pill">
        <span class="live-dot"></span>
        Live tracking
      </div>
    </header>

    <section class="section">
      <div class="section-head">
        <div class="section-label">Development Team</div>
        <div class="member-count">1 member</div>
      </div>

      <a
        class="card"
        id="card"
        href="https://www.roblox.com/users/423428585/profile"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Roblox profile"
      >
        <div class="card-content">

          <div class="person">

            <div class="avatar-wrap">
              <div class="avatar-shell">
                <div class="avatar" id="avatar">H2</div>

                <img
                  class="avatar-img"
                  id="avatarImg"
                  alt="Roblox avatar"
                />
              </div>

              <span class="status-dot" id="dot"></span>
            </div>

            <div class="who">
              <div class="name-row">
                <h2 class="name" id="name">HARRY2O6</h2>

                <span class="verified" title="Tracked developer">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="m7 12 3 3 7-7"></path>
                  </svg>
                </span>
              </div>

              <div class="role loading" id="role">
                Connecting…
              </div>

              <div class="subtext" id="location">
                Checking Roblox presence
              </div>
            </div>

          </div>

          <div class="right-side">
            <div class="profile-btn">
              View profile

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 17 17 7"></path>
                <path d="M8 7h9v9"></path>
              </svg>
            </div>
          </div>

        </div>
      </a>

      <div class="footer">
        <div class="connection">
          <span class="connection-dot"></span>
          <span id="hint">Connecting to Roblox…</span>
        </div>

        <span id="updated">Waiting for first update</span>
      </div>
    </section>

  </main>

  <script>
    const USER_ID = 423428585;
    const POLL_MS = 15000;

    const STATUS = {
      playing: {
        label: "Playing",
        color: "#40df8a"
      },

      studio: {
        label: "In Studio",
        color: "#ffad5c"
      },

      online: {
        label: "Online",
        color: "#7d8797"
      },

      offline: {
        label: "Offline",
        color: "#656d7b"
      },

      unknown: {
        label: "Unknown",
        color: "#656d7b"
      }
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(key, extra = "") {
      const status = STATUS[key] || STATUS.unknown;

      const card = $("card");

      card.style.setProperty("--status-color", status.color);
      card.style.setProperty(
        "--status-glow",
        `${status.color}40`
      );

      $("dot").style.background = status.color;
      $("role").style.color = status.color;

      $("role").textContent = extra
        ? `${status.label} · ${extra}`
        : status.label;

      $("role").classList.remove("loading");
    }

    async function api(type) {
      const response = await fetch(
        `/api/roblox?type=${encodeURIComponent(type)}&userId=${USER_ID}`,
        {
          method: "GET",
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(`API request failed: ${response.status}`);
      }

      const data = await response.json();

      if (data?.error) {
        throw new Error(data.error);
      }

      return data;
    }

    async function updatePresence() {
      try {
        const data = await api("presence");
        const presence = data?.userPresences?.[0];

        if (!presence) {
          throw new Error("No presence data returned");
        }

        const typeMap = {
          0: "offline",
          1: "online",
          2: "playing",
          3: "studio",
          4: "online"
        };

        const key = typeMap[presence.userPresenceType] || "unknown";

        let extra = "";

        if (key === "playing") {
          extra = presence.lastLocation || "In a Roblox experience";
        }

        setStatus(key, extra);

        if (presence.lastLocation) {
          $("location").textContent =
            key === "playing"
              ? `Currently at ${presence.lastLocation}`
              : presence.lastLocation;
        } else {
          $("location").textContent =
            key === "offline"
              ? "Not currently active on Roblox"
              : "Roblox presence detected";
        }

        const now = new Date();

        $("hint").textContent = "Roblox connection active";
        $("updated").textContent =
          `Last checked ${now.toLocaleTimeString()}`;

      } catch (error) {
        console.error(error);

        setStatus("unknown");

        $("location").textContent =
          "Unable to read Roblox presence right now";

        $("hint").textContent =
          "Roblox connection unavailable · retrying";

        $("updated").textContent =
          `Last attempt ${new Date().toLocaleTimeString()}`;
      }
    }

    async function loadUser() {
      try {
        const data = await api("user");

        if (data?.name) {
          $("name").textContent = data.name;
        }

      } catch (error) {
        console.error("User lookup failed:", error);
      }
    }

    async function loadAvatar() {
      try {
        const data = await api("avatar");

        const avatarUrl = data?.data?.[0]?.imageUrl;

        if (!avatarUrl) return;

        const img = $("avatarImg");

        img.onload = () => {
          img.style.display = "block";
          $("avatar").style.display = "none";
        };

        img.src = avatarUrl;

      } catch (error) {
        console.error("Avatar lookup failed:", error);
      }
    }

    async function init() {
      await Promise.allSettled([
        updatePresence(),
        loadUser(),
        loadAvatar()
      ]);
    }

    init();

    setInterval(updatePresence, POLL_MS);
  </script>
</body>
</html>
