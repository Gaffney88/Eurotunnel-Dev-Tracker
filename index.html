<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .subtitle {
      margin: 0;
      color: #8a9099;
      font-size: 13px;
    }

    .section {
      margin-bottom: 12px;
      color: #8a9099;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }

    /* Horizontal grid layout matching the reference image */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: #14171c;
      border: 1px solid #22262e;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .card:hover {
      border-color: #3b82f6;
      background: #181c23;
      transform: translateY(-2px);
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    /* Rounded square avatar style from the reference image */
    .avatar,
    .avatar-img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252b36;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
    }

    .avatar-img {
      display: none;
      object-fit: cover;
    }

    .status-dot {
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 12px;
      height: 12px;
      border: 2px solid #14171c;
      border-radius: 50%;
      background: #71717a;
      transition: background 0.3s ease;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role {
      color: #8a9099;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #6b7280;
      font-size: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Dev Tracker</h1>
      <p class="subtitle">Development team presence status</p>
    </header>

    <div class="section">Management</div>

    <div class="team-grid" id="teamGrid">
      <!-- Cards will be dynamically injected here -->
    </div>

    <div class="footer">
      <div id="statusIndicator">Checking Roblox...</div>
      <div id="footer">Auto-refreshing</div>
    </div>

  </div>

  <script>
    const USERS = [
      { id: 423428585, defaultName: "HARRY2O6", initials: "H2", role: "Game Lead" },
      { id: 154454341, defaultName: "ericplane", initials: "EP", role: "Senior Developer" }
    ];

    const POLL_TIME = 15000;

    const STATUS = {
      playing: { text: "Playing", color: "#10b981" },
      studio: { text: "In Studio", color: "#f59e0b" },
      online: { text: "Online", color: "#3b82f6" },
      offline: { text: "Offline", color: "#71717a" },
      unknown: { text: "Unknown", color: "#71717a" }
    };

    function renderCards() {
      const grid = document.getElementById("teamGrid");
      grid.innerHTML = USERS.map(user => `
        <a class="card" href="https://www.roblox.com/users/${user.id}/profile" target="_blank" rel="noopener noreferrer">
          <div class="avatar-wrap">
            <div class="avatar" id="avatar-${user.id}">${user.initials}</div>
            <img class="avatar-img" id="avatarImg-${user.id}" alt="Roblox avatar">
            <span class="status-dot" id="statusDot-${user.id}"></span>
          </div>
          <div class="info">
            <div class="name" id="name-${user.id}">${user.defaultName}</div>
            <div class="role" id="role-${user.id}">${user.role}</div>
          </div>
        </a>
      `).join('');
    }

    async function fetchUserData(userId, type) {
      const response = await fetch(`/api/roblox?type=${type}&userId=${userId}`, {
        cache: "no-store"
      });
      if (!response.ok) throw new Error("Request failed");
      return response.json();
    }

    async function updateUserInfo(user) {
      try {
        const data = await fetchUserData(user.id, "user");
        if (data.name) {
          document.getElementById(`name-${user.id}`).textContent = data.name;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function updateAvatar(user) {
      try {
        const data = await fetchUserData(user.id, "avatar");
        const imageUrl = data?.data?.[0]?.imageUrl;
        if (!imageUrl) return;

        const img = document.getElementById(`avatarImg-${user.id}`);
        img.src = imageUrl;
        img.onload = () => {
          img.style.display = "block";
          document.getElementById(`avatar-${user.id}`).style.display = "none";
        };
      } catch (err) {
        console.error(err);
      }
    }

    async function updatePresence(user) {
      try {
        const data = await fetchUserData(user.id, "presence");
        const presence = data?.userPresences?.[0];

        const typeMap = { 0: "offline", 1: "online", 2: "playing", 3: "studio" };
        const type = presence ? (typeMap[presence.userPresenceType] || "unknown") : "offline";
        const statusObj = STATUS[type] || STATUS.unknown;

        let roleText = user.role;
        if (type === "playing" && presence.lastLocation) {
          roleText = `Playing: ${presence.lastLocation}`;
        } else if (type === "studio") {
          roleText = "In Studio";
        } else if (type === "online") {
          roleText = "Online";
        } else if (type === "offline") {
          roleText = "Offline";
        }

        document.getElementById(`role-${user.id}`).textContent = roleText;
        document.getElementById(`statusDot-${user.id}`).style.background = statusObj.color;

      } catch (err) {
        console.error(err);
        document.getElementById(`role-${user.id}`).textContent = "Connection error";
        document.getElementById(`statusDot-${user.id}`).style.background = STATUS.unknown.color;
      }
    }

    async function refreshAll() {
      await Promise.all(USERS.map(async (user) => {
        await Promise.all([
          updateUserInfo(user),
          updateAvatar(user),
          updatePresence(user)
        ]);
      }));
      document.getElementById("statusIndicator").textContent = `Last updated ${new Date().toLocaleTimeString()}`;
    }

    // Initialize
    renderCards();
    refreshAll();
    setInterval(refreshAll, POLL_TIME);
  </script>

</body>
</html>
